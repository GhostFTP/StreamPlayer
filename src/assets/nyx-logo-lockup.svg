<svg viewBox="0 0 360 120" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="saturnBody" x1="26" y1="96" x2="94" y2="30" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2E1065"/>
      <stop offset="40%" stop-color="#7C3AED"/>
      <stop offset="75%" stop-color="#C084FC"/>
      <stop offset="100%" stop-color="#F5D0FE"/>
    </linearGradient>
    <linearGradient id="ringGrad" x1="14" y1="62" x2="106" y2="62" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0"/>
      <stop offset="18%" stop-color="#C4B5FD"/>
      <stop offset="50%" stop-color="#F5D0FE"/>
      <stop offset="82%" stop-color="#C4B5FD"/>
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="moonGrad" x1="70" y1="4" x2="100" y2="30" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F5D0FE"/>
      <stop offset="100%" stop-color="#F0ABFC"/>
    </linearGradient>
    <radialGradient id="haloGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="specular" cx="35%" cy="30%" r="45%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.4"/>
    </filter>
    <filter id="haloBlur" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>

    <mask id="planetWithN">
      <circle cx="60" cy="62" r="28" fill="white"/>
      <g fill="black">
        <circle cx="47.5" cy="43.5" r="2.6"/>
        <circle cx="71.5" cy="43.5" r="2.6"/>
        <circle cx="47.5" cy="49.5" r="2.6"/>
        <circle cx="53.5" cy="49.5" r="2.6"/>
        <circle cx="71.5" cy="49.5" r="2.6"/>
        <circle cx="47.5" cy="55.5" r="2.6"/>
        <circle cx="59.5" cy="55.5" r="2.6"/>
        <circle cx="71.5" cy="55.5" r="2.6"/>
        <circle cx="47.5" cy="61.5" r="2.6"/>
        <circle cx="59.5" cy="61.5" r="2.6"/>
        <circle cx="71.5" cy="61.5" r="2.6"/>
        <circle cx="47.5" cy="67.5" r="2.6"/>
        <circle cx="65.5" cy="67.5" r="2.6"/>
        <circle cx="71.5" cy="67.5" r="2.6"/>
        <circle cx="47.5" cy="73.5" r="2.6"/>
        <circle cx="71.5" cy="73.5" r="2.6"/>
        <circle cx="47.5" cy="79.5" r="2.6"/>
        <circle cx="71.5" cy="79.5" r="2.6"/>
      </g>
    </mask>

    <clipPath id="planetClip">
      <circle cx="60" cy="62" r="28"/>
    </clipPath>
    <clipPath id="ringFrontHalf">
      <rect x="-100" y="62" width="320" height="200" transform="rotate(-26 60 62)"/>
    </clipPath>
  </defs>

  <g>
    <circle cx="60" cy="62" r="46" fill="url(#haloGrad)" filter="url(#haloBlur)"/>
    <ellipse cx="60" cy="62" rx="44" ry="12" transform="rotate(-26 60 62)"
             fill="none" stroke="url(#ringGrad)" stroke-width="2" opacity="0.9"/>
    <g mask="url(#planetWithN)">
      <circle cx="60" cy="62" r="28" fill="url(#saturnBody)"/>
      <circle cx="60" cy="62" r="28" fill="url(#specular)" clip-path="url(#planetClip)"/>
    </g>
    <g clip-path="url(#ringFrontHalf)">
      <ellipse cx="60" cy="62" rx="44" ry="12" transform="rotate(-26 60 62)"
               fill="none" stroke="url(#ringGrad)" stroke-width="7" opacity="0.3" filter="url(#softGlow)"/>
      <ellipse cx="60" cy="62" rx="44" ry="12" transform="rotate(-26 60 62)"
               fill="none" stroke="url(#ringGrad)" stroke-width="2.5"/>
    </g>
    <path d="M96,4 A11,11 0 1,0 96,26 A7.7,7.7 0 1,1 96,4 Z" fill="url(#moonGrad)"/>
    <g fill="#F5D0FE">
      <path d="M16 22 L18 27 L23 29 L18 31 L16 36 L14 31 L9 29 L14 27 Z"/>
    </g>
    <g fill="#C4B5FD">
      <path d="M104 100 L105.2 103 L108.2 104.2 L105.2 105.4 L104 108.4 L102.8 105.4 L99.8 104.2 L102.8 103 Z"/>
      <circle cx="12" cy="96" r="1.3" opacity="0.7"/>
    </g>
  </g>

  <text x="132" y="80"
        font-family="'Poppins', 'Segoe UI', system-ui, sans-serif"
        font-size="52"
        font-weight="600"
        letter-spacing="1"
        fill="#F3E8FF">nyx</text>
</svg>
