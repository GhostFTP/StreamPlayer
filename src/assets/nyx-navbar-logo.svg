<svg viewBox="0 0 168 48" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="navSaturnBody" x1="8" y1="40" x2="40" y2="8" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2E1065"/>
      <stop offset="40%" stop-color="#7C3AED"/>
      <stop offset="75%" stop-color="#C084FC"/>
      <stop offset="100%" stop-color="#F5D0FE"/>
    </linearGradient>
    <linearGradient id="navRingGrad" x1="2" y1="24" x2="46" y2="24" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0"/>
      <stop offset="18%" stop-color="#C4B5FD"/>
      <stop offset="50%" stop-color="#F5D0FE"/>
      <stop offset="82%" stop-color="#C4B5FD"/>
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="navMoonGrad" x1="30" y1="0" x2="44" y2="12" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F5D0FE"/>
      <stop offset="100%" stop-color="#F0ABFC"/>
    </linearGradient>
    <radialGradient id="navSpecular" cx="35%" cy="30%" r="45%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>

    <mask id="navPlanetWithN">
      <circle cx="24" cy="24" r="12" fill="white"/>
      <g fill="black">
        <circle cx="19" cy="17" r="1.1"/>
        <circle cx="29" cy="17" r="1.1"/>
        <circle cx="19" cy="19.6" r="1.1"/>
        <circle cx="21.6" cy="19.6" r="1.1"/>
        <circle cx="29" cy="19.6" r="1.1"/>
        <circle cx="19" cy="22.2" r="1.1"/>
        <circle cx="24" cy="22.2" r="1.1"/>
        <circle cx="29" cy="22.2" r="1.1"/>
        <circle cx="19" cy="24.8" r="1.1"/>
        <circle cx="24" cy="24.8" r="1.1"/>
        <circle cx="29" cy="24.8" r="1.1"/>
        <circle cx="19" cy="27.4" r="1.1"/>
        <circle cx="26.4" cy="27.4" r="1.1"/>
        <circle cx="29" cy="27.4" r="1.1"/>
        <circle cx="19" cy="30" r="1.1"/>
        <circle cx="29" cy="30" r="1.1"/>
        <circle cx="19" cy="32.6" r="1.1"/>
        <circle cx="29" cy="32.6" r="1.1"/>
      </g>
    </mask>

    <clipPath id="navPlanetClip">
      <circle cx="24" cy="24" r="12"/>
    </clipPath>
    <clipPath id="navRingFrontHalf">
      <rect x="-40" y="24" width="130" height="80" transform="rotate(-26 24 24)"/>
    </clipPath>
  </defs>

  <!-- compact icon -->
  <g>
    <ellipse cx="24" cy="24" rx="19" ry="5.2" transform="rotate(-26 24 24)"
             fill="none" stroke="url(#navRingGrad)" stroke-width="1.3" opacity="0.9"/>
    <g mask="url(#navPlanetWithN)">
      <circle cx="24" cy="24" r="12" fill="url(#navSaturnBody)"/>
      <circle cx="24" cy="24" r="12" fill="url(#navSpecular)" clip-path="url(#navPlanetClip)"/>
    </g>
    <g clip-path="url(#navRingFrontHalf)">
      <ellipse cx="24" cy="24" rx="19" ry="5.2" transform="rotate(-26 24 24)"
               fill="none" stroke="url(#navRingGrad)" stroke-width="1.6"/>
    </g>
    <path d="M39,1 A4.7,4.7 0 1,0 39,10.4 A3.3,3.3 0 1,1 39,1 Z" fill="url(#navMoonGrad)"/>
  </g>

  <!-- wordmark -->
  <text x="52" y="32"
        font-family="'Poppins', 'Segoe UI', system-ui, sans-serif"
        font-size="24"
        font-weight="600"
        letter-spacing="0.5"
        fill="#F3E8FF">nyx</text>
</svg>
